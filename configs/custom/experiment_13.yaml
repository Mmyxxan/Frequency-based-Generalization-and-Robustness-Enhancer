# Train Fused_CNN_ResNet50_CNN_ResNet50_Averaging on ProGAN following RoHL
# python main.py --config-file "configs/custom/experiment_13.yaml" --no-tf-test True --resume False
MODEL:
  TYPE: "AveragingModel"
  NAME: "Fused_CNN_ResNet50_CNN_ResNet50_Averaging"
  # MODEL_DIR: "/kaggle/input/train-low-freq/pytorch/default/1"
  # MODEL_NAME: "model-best.pth.tar"
  MODEL_DIR: "/kaggle/input/models/myxxanaplt/train-high-freq-cnndet/pytorch/default/1"
  MODEL_NAME: "model-best.pth.tar"
  RESUME: True
  BACKBONE:
    PRETRAINED: True
    FREEZE: False
    RESNET50_AM_WEIGHTS: ""

DATASET:
  NAME: "CNNSpot"
  DATA_DIR: ""
  NUM_CLASSES: 2

DATALOADER:
  BATCH_SIZE: 128

TRANSFORM:
  TRANSFORMS: ["resize", "to_tensor", "normalize"]
  NORMALIZE_BACKBONE: True
  INTERPOLATION_MODE: "bilinear"
  INPUT_SIZE: (224, 224)
  NO_TRANSFORM_TEST: True # NO_TRANSFORM_TEST does not matter because TRANSFORMS is basic
  # GAUSSIAN BLUR
  GB_P: 0.5  # propability of applying this operation
  GB_K: 5    # kernel size (should be an odd number)
  _C.TRANSFORM.GB_SIGMA: (0.1, 2.0)  # Uniform[0, 2]
  # JPEG COMPRESSION
  JPEG_P: 0.25
  JPEG_QUALITY: (50, 99)
  # BRIGHTNESS
  BRIGHTNESS: (0.85, 1.15)
  BRIGHTNESS_P: 0.25
  # CONTRAST
  CONTRAST: (0.7, 1.3)
  CONTRAST_P: 0.25

TRAINER:
  TYPE: 3
  USE_CUDA: True
  IS_TRAIN: True
  NUM_EPOCHS: 4
  NO_TEST: False
  TEST_FINAL_MODEL: "best_val"
  OPTIM:
    NAME: "sgd"
    LR: 0.002
    STEPSIZE: [20]

RoHL:
  STAGE: 3
  USE_JSD: False
  USE_FEATURES_CONSISTENCY: False

EVALUATOR:
  TYPE: 1
